name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            export BASE_PATH="/${{ github.event.repository.name }}/dev/"
          else
            export BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          npm run build
          rm -rf /tmp/curr-dist
          cp -r dist /tmp/curr-dist

      - name: Stage combined site in gh-pages branch
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH_NAME="${{ github.ref_name }}"

          HAS_GH_PAGES=false
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            HAS_GH_PAGES=true
            git fetch origin gh-pages:gh-pages
          fi

          # If deploying dev first and gh-pages has no root site yet, build origin/main into /tmp/main-dist
          rm -rf /tmp/main-dist
          NEED_MAIN_BOOTSTRAP=false
          if [ "$BRANCH_NAME" = "dev" ]; then
            if [ "$HAS_GH_PAGES" = "false" ] || ! git cat-file -e gh-pages:index.html 2>/dev/null; then
              NEED_MAIN_BOOTSTRAP=true
            fi
          fi

          if [ "$NEED_MAIN_BOOTSTRAP" = "true" ]; then
            git fetch origin main
            rm -rf /tmp/main-src
            git worktree add --detach /tmp/main-src origin/main
            (
              cd /tmp/main-src
              npm ci
              BASE_PATH="/${REPO_NAME}/" npm run build
            )
            cp -r /tmp/main-src/dist /tmp/main-dist
            git worktree remove --force /tmp/main-src
          fi

          # Switch to gh-pages inside the authenticated checkout workspace
          if [ "$HAS_GH_PAGES" = "true" ]; then
            git checkout -f gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          if [ -d /tmp/main-dist ]; then
            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'dev' ! -name '.nojekyll' -exec rm -rf {} +
            cp -r /tmp/main-dist/* .
          fi

          if [ "$BRANCH_NAME" = "dev" ]; then
            rm -rf dev
            mkdir -p dev
            cp -r /tmp/curr-dist/* dev/
          else
            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'dev' ! -name '.nojekyll' -exec rm -rf {} +
            cp -r /tmp/curr-dist/* .
          fi

          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy(${BRANCH_NAME}): publish ${GITHUB_SHA::7}"
            git push -u origin gh-pages
          fi

          rm -rf /tmp/pages-artifact
          mkdir -p /tmp/pages-artifact
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -r {} /tmp/pages-artifact/ \;

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/pages-artifact'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
