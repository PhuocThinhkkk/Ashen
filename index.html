<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080e" />
    <link rel="icon" href="data:," />
    <title>Souls Browser: The Ashen Knight</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Playable Three.js game canvas"></canvas>

      <!-- Player Status Bars (Top Left) -->
      <section id="player-bars" aria-label="Player Status">
        <div class="bar-wrapper hp-wrapper">
          <div class="bar-label">HP</div>
          <div class="bar-track">
            <div id="player-hp-chip" class="bar-chip"></div>
            <div id="player-hp-fill" class="bar-fill hp-fill"></div>
          </div>
          <div id="player-hp-text" class="bar-text">100 / 100</div>
        </div>
        <div class="bar-wrapper stamina-wrapper">
          <div class="bar-label">SP</div>
          <div class="bar-track">
            <div id="player-stamina-fill" class="bar-fill stamina-fill"></div>
          </div>
          <div id="player-stamina-text" class="bar-text">100 / 100</div>
        </div>
      </section>

      <!-- Lock-On Reticle -->
      <div id="lockon-reticle" class="hidden">
        <div class="reticle-diamond"></div>
      </div>

      <!-- Boss Status Bar (Bottom Center) -->
      <section id="boss-hud" aria-label="Boss Status">
        <div class="boss-header">
          <span class="boss-title">THE ASHEN SANCTUARY</span>
          <h2 id="boss-name" class="boss-name">MALAKHOR, THE ASHEN KNIGHT</h2>
        </div>
        <div class="boss-bar-track">
          <div id="boss-hp-chip" class="boss-hp-chip"></div>
          <div id="boss-hp-fill" class="boss-hp-fill"></div>
          <div class="boss-bar-frame"></div>
        </div>
      </section>

      <!-- Floating Damage Numbers Container -->
      <div id="damage-container" pointer-events="none"></div>

      <!-- Controls Guide Overlay (Bottom Left) -->
      <div id="controls-guide">
        <div class="control-key"><kbd>WASD</kbd> Move</div>
        <div class="control-key"><kbd>Shift</kbd> Sprint</div>
        <div class="control-key"><kbd>Space</kbd> Dodge Roll (i-frames)</div>
        <div class="control-key"><kbd>L-Click / J</kbd> Light Combo</div>
        <div class="control-key"><kbd>R-Click / K</kbd> Heavy Thrust</div>
        <div class="control-key"><kbd>Tab / Q</kbd> Lock On</div>
        <div class="control-key"><kbd>R</kbd> Restart</div>
      </div>

      <!-- Death & Victory Banners -->
      <div id="death-overlay" class="banner-overlay hidden">
        <h1 class="death-title">YOU DIED</h1>
        <p class="banner-prompt">Press <kbd>R</kbd> to Rise Again</p>
      </div>

      <div id="victory-overlay" class="banner-overlay hidden">
        <h1 class="victory-title">LEGEND VANQUISHED</h1>
        <p class="banner-prompt">Press <kbd>R</kbd> to Face the Trial Once More</p>
      </div>

      <!-- Mobile Touch Controls -->
      <div id="touch-controls" aria-hidden="true">
        <div id="touch-stick">
          <div id="touch-knob"></div>
        </div>
        <div class="touch-action-buttons">
          <button id="touch-attack-btn" type="button">Attack</button>
          <button id="touch-dodge-btn" type="button">Dodge</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
