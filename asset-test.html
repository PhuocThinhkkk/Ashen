<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Milestone 3 Isolated Asset Validation Harness</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e16;
        color: #e5ded2;
        font-family: monospace;
      }
      #test-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #overlay {
        position: absolute;
        top: 16px;
        left: 16px;
        background: rgba(10, 14, 22, 0.85);
        border: 1px solid #7a5e2a;
        padding: 12px 16px;
        border-radius: 4px;
        font-size: 13px;
        line-height: 1.5;
        max-width: 480px;
        pointer-events: auto;
      }
      .status-ok { color: #38d665; font-weight: bold; }
      .status-wait { color: #ffaa33; }
      .status-err { color: #db2c2c; font-weight: bold; }
      .controls {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        background: #182232;
        border: 1px solid #b5954a;
        color: #e5ded2;
        padding: 4px 8px;
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
        border-radius: 2px;
      }
      button:hover {
        background: #28364e;
      }
      button.active {
        background: #b5954a;
        color: #0a0e16;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <canvas id="test-canvas"></canvas>
    <div id="overlay">
      <div style="font-weight: bold; color: #ffaa33; margin-bottom: 4px;">MILESTONE 3: ISOLATED ASSET VALIDATION</div>
      <div id="load-status" class="status-wait">Loading GLB assets...</div>
      <div id="player-info" style="margin-top: 6px;">Player: -</div>
      <div id="boss-info">Boss: -</div>
      <div id="weapon-info">Weapon Socket: -</div>
      <div class="controls" id="anim-buttons"></div>
    </div>
    <script type="module" src="/src/asset-test.ts"></script>
  </body>
</html>
